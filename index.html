<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mayur Lyrics</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0e0e0e;
  font-family: Arial, sans-serif;
  color: #fff;
  overflow: hidden;
}

#app {
  display: flex;
  height: 100vh;
  background: #0e0e0e;
}

#sidebar {
  width: 260px;
  background: #161616;
  border-right: 1px solid #2a2a2a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  gap: 18px;
}

#album-art {
  width: 160px;
  height: 160px;
  background: linear-gradient(135deg, #2a1a4e, #1a3a4e);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#album-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 12px;
  display: none;
}

#album-emoji { font-size: 48px; }

#song-title {
  font-size: 16px;
  font-weight: 600;
  text-align: center;
  line-height: 1.3;
}

#artist-name {
  font-size: 13px;
  color: #b3b3b3;
  text-align: center;
}

#now-playing-label {
  font-size: 11px;
  color: #888;
  display: flex;
  align-items: center;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

#status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #1db954;
  display: inline-block;
  margin-right: 6px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

#lyrics-panel {
  flex: 1;
  overflow-y: auto;
  padding: 60px 40px;
  scroll-behavior: smooth;
}

#lyrics-panel::-webkit-scrollbar { width: 4px; }
#lyrics-panel::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

#lyrics-inner {
  max-width: 600px;
  margin: 0 auto;
  text-align: center;
}

.lyric-line {
  font-size: 22px;
  font-weight: 600;
  color: #3a3a3a;
  line-height: 1.6;
  padding: 6px 0;
  transition: color 0.3s, font-size 0.3s, transform 0.3s;
  transform-origin: center;
}

.lyric-line.active {
  color: #fff;
  font-size: 26px;
  transform: scale(1.04);
}

.lyric-line.near {
  color: #888;
  font-size: 23px;
}

#status-msg {
  font-size: 15px;
  color: #555;
  text-align: center;
  padding: 40px;
}

#sync-badge {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 20px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  display: none;
}

.badge-synced { background: #1db95422; color: #1db954; }
.badge-unsynced { background: #ffffff11; color: #888; }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div id="album-art">
      <img id="album-img" src="" alt="">
      <span id="album-emoji">🎵</span>
    </div>
    <div id="now-playing-label">
      <span id="status-dot"></span> Now playing
    </div>
    <div id="song-title">Loading...</div>
    <div id="artist-name">—</div>
    <div id="sync-badge"></div>
  </div>

  <div id="lyrics-panel">
    <div id="lyrics-inner">
      <div id="status-msg">Fetching lyrics...</div>
    </div>
  </div>
</div>

<script>
const API_KEY = "9e220e18970b8a2019578c3118beb55c";
const USERNAME = "mrmayur";

let lastTrack = "";
let syncedLines = [];  // [{time: seconds, text: string}]
let unsyncedLines = [];
let syncTimer = null;
let isSynced = false;
let songStartTime = null; // when we started tracking this song

function setStatus(msg) {
  document.getElementById("lyrics-inner").innerHTML = `<div id="status-msg">${msg}</div>`;
}

function setBadge(synced) {
  const b = document.getElementById("sync-badge");
  b.style.display = "block";
  b.className = "sync-badge " + (synced ? "badge-synced" : "badge-unsynced");
  b.textContent = synced ? "⚡ Synced" : "~ Unsynced";
}

// --- SYNCED MODE (lrclib) ---

function parseLRC(lrc) {
  const lines = [];
  for (const raw of lrc.split("\n")) {
    const match = raw.match(/^\[(\d+):(\d+\.\d+)\](.*)/);
    if (match) {
      const time = parseInt(match[1]) * 60 + parseFloat(match[2]);
      const text = match[3].trim();
      lines.push({ time, text });
    }
  }
  return lines.sort((a, b) => a.time - b.time);
}

function renderSyncedLyrics() {
  const inner = document.getElementById("lyrics-inner");
  inner.innerHTML = syncedLines
    .map((l, i) => `<div class="lyric-line" data-i="${i}">${l.text || "♪"}</div>`)
    .join("");
}

function highlightSynced(index) {
  document.querySelectorAll(".lyric-line").forEach((el, i) => {
    el.classList.remove("active", "near");
    const d = Math.abs(i - index);
    if (d === 0) el.classList.add("active");
    else if (d <= 2) el.classList.add("near");
  });
  const active = document.querySelector(".lyric-line.active");
  if (active) active.scrollIntoView({ behavior: "smooth", block: "center" });
}

function tickSynced() {
  if (!syncedLines.length || !songStartTime) return;
  const elapsed = (Date.now() - songStartTime) / 1000;

  let current = 0;
  for (let i = 0; i < syncedLines.length; i++) {
    if (syncedLines[i].time <= elapsed) current = i;
    else break;
  }

  highlightSynced(current);
  syncTimer = requestAnimationFrame(tickSynced);
}

function startSynced(lrc) {
  cancelAnimationFrame(syncTimer);
  syncedLines = parseLRC(lrc).filter(l => l.text);
  if (!syncedLines.length) return false;
  songStartTime = Date.now();
  renderSyncedLyrics();
  syncTimer = requestAnimationFrame(tickSynced);
  setBadge(true);
  return true;
}

// --- UNSYNCED FALLBACK ---

function highlightUnsynced(index) {
  document.querySelectorAll(".lyric-line").forEach((el, i) => {
    el.classList.remove("active", "near");
    const d = Math.abs(i - index);
    if (d === 0) el.classList.add("active");
    else if (d <= 2) el.classList.add("near");
  });
  const active = document.querySelector(".lyric-line.active");
  if (active) active.scrollIntoView({ behavior: "smooth", block: "center" });
}

function startUnsynced(text) {
  cancelAnimationFrame(syncTimer);
  clearTimeout(syncTimer);

  unsyncedLines = text.split("\n").map(l => l.trim()).filter(l => l && !l.match(/^\[.*\]$/));
  if (!unsyncedLines.length) { setStatus("No lyrics found."); return; }

  const inner = document.getElementById("lyrics-inner");
  inner.innerHTML = unsyncedLines.map((l, i) => `<div class="lyric-line" data-i="${i}">${l}</div>`).join("");

  let current = 0;
  highlightUnsynced(0);
  setBadge(false);

  function next() {
    if (current < unsyncedLines.length - 1) {
      current++;
      highlightUnsynced(current);
      syncTimer = setTimeout(next, Math.max(1500, unsyncedLines[current].split(" ").length * 420));
    }
  }
  syncTimer = setTimeout(next, Math.max(1500, unsyncedLines[0].split(" ").length * 420));
}

// --- MAIN FETCH ---

async function fetchLyrics(artist, song) {
  setStatus("Loading lyrics...");

  // 1. Try lrclib for synced lyrics
  try {
    const r = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(song)}`);
    if (r.ok) {
      const d = await r.json();
      if (d.syncedLyrics && startSynced(d.syncedLyrics)) return;
      if (d.plainLyrics && d.plainLyrics.trim()) { startUnsynced(d.plainLyrics); return; }
    }
  } catch {}

  // 2. Fallback to lyrics.ovh
  try {
    const r = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(song)}`);
    const d = await r.json();
    if (d.lyrics?.trim()) { startUnsynced(d.lyrics); return; }
  } catch {}

  setStatus("No lyrics found for this track.");
}

async function updateSong() {
  try {
    const res = await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=1`);
    const data = await res.json();
    const track = data.recenttracks.track[0];
    const song = track.name;
    const artist = track.artist["#text"];
    const live = track["@attr"]?.nowplaying === "true";

    document.getElementById("song-title").textContent = song;
    document.getElementById("artist-name").textContent = artist;
    document.getElementById("status-dot").style.background = live ? "#1db954" : "#555";

    const img = track.image?.[3]?.["#text"];
    document.getElementById("album-img").src = img || "";
    document.getElementById("album-img").style.display = img ? "block" : "none";
    document.getElementById("album-emoji").style.display = img ? "none" : "block";

    const key = song + artist;
    if (key === lastTrack) return;
    lastTrack = key;

    cancelAnimationFrame(syncTimer);
    clearTimeout(syncTimer);

    fetchLyrics(artist, song);

  } catch { setStatus("Connection error."); }
}

updateSong();
setInterval(updateSong, 10000);
</script>
</body>
</html>
